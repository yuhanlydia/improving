# Start here: one round; all four arms use the same raw-corpus size and SFT.
# Memory is a target profile, not a measured guarantee. Paths are relative to repo root.
seed: 42
model:
  name: Qwen/Qwen2.5-Coder-1.5B-Instruct
  device: auto
  dtype: bfloat16
  attn_implementation: sdpa
data:
  train: data/mbpp/train.jsonl
  calibration: data/mbpp/calibration.jsonl
  validation: data/mbpp/validation.jsonl
  eval: data/mbpp/eval.jsonl
output_dir: runs/pilot_16gb_seed42
data_seed: 42
data_limits:
  train: 128
  eval: 64
methods: [plain, ssd, spd_hard, spectral_soft]
rounds: 1
generation:
  train_samples: 1
  eval_samples: 64
  batch_size: 4
  max_new_tokens: 512
  max_prompt_tokens: 1024
  temperature: 0.8
  top_p: 0.95
  top_k: 0
calibration:
  max_examples: 50
  max_length: 1536
  span_mode: completion
  layers: null
  rank_fraction: 0.5
  tau: 1.0
  rho: 0.5
train:
  epochs: 5
  batch_size: 1
  gradient_accumulation_steps: 16
  max_length: 1536
  learning_rate: 0.00001
  weight_decay: 0.01
  warmup_ratio: 0.03
  max_grad_norm: 1.0
  lora_rank: 8
  lora_alpha: 8
  lora_dropout: 0.05
  gradient_checkpointing: true
  loss_scope: all
evaluation:
  backend: docker
  docker_image: python:3.11-slim
  workers: 4
  timeout: 5
  ks: [1, 8, 32, 64]
  correct_budget: 8
  bootstrap_samples: 1000
diagnostics:
  evaluate_generation_policy: true
