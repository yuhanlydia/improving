[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "improving-code"
version = "0.1.0"
description = "Reproducible experiments on correct-solution diversity in code self-distillation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
train = ["torch>=2.5,<2.8", "transformers==4.51.3", "peft==0.15.2", "accelerate==1.6.0", "datasets==3.5.1", "safetensors>=0.4"]
evalplus = ["evalplus==0.3.1"]
test = ["pytest>=8,<9"]
analysis = ["matplotlib>=3.8,<4"]

[project.scripts]
improving = "improving.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
